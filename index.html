<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Tanks Mobile</title>
    <style>
        /* Оптимизация стилей и сброс */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #2c3e50; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Игровой холст */
        #gameCanvas { display: block; width: 100%; height: 100%; }

        /* UI Слои */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: white; transition: opacity 0.3s; z-index: 10; }
        .hidden { display: none !important; }

        h1 { font-size: 3rem; margin-bottom: 2rem; color: #f39c12; text-shadow: 0 4px 10px rgba(243, 156, 18, 0.5); text-align: center;}
        
        .btn { background: #e67e22; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; margin: 10px; box-shadow: 0 5px 0 #d35400; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; font-weight: bold;}
        .btn:active { transform: translateY(5px); box-shadow: 0 0 0 #d35400; }

        /* Игровой интерфейс */
        #hud { position: absolute; top: 10px; left: 20px; color: white; font-size: 1.5rem; font-weight: bold; z-index: 5; pointer-events: none; text-shadow: 1px 1px 2px black;}
        
        /* Виртуальные джойстики (визуализация) */
        .joystick-zone { position: absolute; bottom: 10%; width: 40%; height: 50%; z-index: 5; }
        #zone-left { left: 0; }
        #zone-right { right: 0; }
        .joy-base { position: absolute; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); display: none; background: rgba(255,255,255,0.1); pointer-events: none; }
        .joy-stick { position: absolute; background: rgba(255,255,255,0.5); border-radius: 50%; width: 50px; height: 50px; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">Очки: <span id="score">0</span></div>

    <div id="zone-left" class="joystick-zone hidden"></div>
    <div id="zone-right" class="joystick-zone hidden"></div>
    
    <div id="joyBaseL" class="joy-base"><div id="joyStickL" class="joy-stick"></div></div>
    <div id="joyBaseR" class="joy-base"><div id="joyStickR" class="joy-stick"></div></div>

    <div id="lobby" class="ui-layer">
        <h1>ТАНКИ ПРО</h1>
        <button class="btn" onclick="startGame()">Играть</button>
        <button class="btn" onclick="showSettings()">Настройки</button>
    </div>

    <div id="settings" class="ui-layer hidden">
        <h1>Настройки графики</h1>
        <button class="btn" id="gfxBtn" onclick="toggleGraphics()">Графика: ВЫСОКАЯ</button>
        <button class="btn" style="background:#7f8c8d; box-shadow: 0 5px 0 #2c3e50;" onclick="showLobby()">Назад</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * НАСТРОЙКИ И СОСТОЯНИЯ
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw, ch;
let gameState = 'lobby'; // lobby, settings, playing
let score = 0;
let lastTime = 0;
let isHighGraphics = true; // Влияет на частицы и эффекты

// Элементы UI
const lobbyEl = document.getElementById('lobby');
const settingsEl = document.getElementById('settings');
const hudEl = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const gfxBtn = document.getElementById('gfxBtn');
const zoneL = document.getElementById('zone-left');
const zoneR = document.getElementById('zone-right');
const joyBaseL = document.getElementById('joyBaseL');
const joyStickL = document.getElementById('joyStickL');
const joyBaseR = document.getElementById('joyBaseR');
const joyStickR = document.getElementById('joyStickR');

function resize() {
    cw = canvas.width = window.innerWidth;
    ch = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/**
 * СОЗДАНИЕ ASSETS (SVG Анимации и Спрайты в Base64)
 */
function createTankImage(color) {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
            <rect x="10" y="5" width="20" height="90" rx="5" fill="#111" />
            <rect x="70" y="5" width="20" height="90" rx="5" fill="#111" />
            <g stroke="#333" stroke-width="2">
                <line x1="10" y1="20" x2="30" y2="20"/><line x1="10" y1="40" x2="30" y2="40"/><line x1="10" y1="60" x2="30" y2="60"/><line x1="10" y1="80" x2="30" y2="80"/>
                <line x1="70" y1="20" x2="90" y2="20"/><line x1="70" y1="40" x2="90" y2="40"/><line x1="70" y1="60" x2="90" y2="60"/><line x1="70" y1="80" x2="90" y2="80"/>
            </g>
            <rect x="25" y="15" width="50" height="70" rx="10" fill="${color}" stroke="#000" stroke-width="2"/>
        </svg>
    `;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return img;
}

function createTurretImage(color) {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
            <rect x="42" y="0" width="16" height="60" fill="#7f8c8d" stroke="#000" stroke-width="2"/>
            <circle cx="50" cy="50" r="22" fill="${color}" stroke="#000" stroke-width="2"/>
            <rect x="40" y="40" width="20" height="20" fill="#2c3e50" rx="3"/>
        </svg>
    `;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return img;
}

const images = {
    playerHull: createTankImage('#27ae60'),
    playerTurret: createTurretImage('#2ecc71'),
    enemyHull: createTankImage('#c0392b'),
    enemyTurret: createTurretImage('#e74c3c')
};

/**
 * ИГРОВЫЕ ОБЪЕКТЫ И МАССИВЫ
 */
let player;
let enemies = [];
let bullets = [];
let particles = [];

class Tank {
    constructor(x, y, isPlayer) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.speed = isPlayer ? 180 : 100; // пикселей в секунду
        this.hullAngle = 0;
        this.turretAngle = 0;
        this.isPlayer = isPlayer;
        this.radius = 25;
        this.lastShot = 0;
        this.hp = isPlayer ? 100 : 30;
    }

    update(dt) {
        // Движение
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Поворот корпуса (по вектору движения)
        if (this.vx !== 0 || this.vy !== 0) {
            this.hullAngle = Math.atan2(this.vy, this.vx) + Math.PI / 2; // +90 град из-за ориентации SVG
        }

        // Ограничения карты
        this.x = Math.max(this.radius, Math.min(cw - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(ch - this.radius, this.y));
    }

    draw(ctx) {
        const hull = this.isPlayer ? images.playerHull : images.enemyHull;
        const turret = this.isPlayer ? images.playerTurret : images.enemyTurret;

        // Корпус
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.hullAngle);
        if(hull.complete) ctx.drawImage(hull, -30, -30, 60, 60);
        ctx.restore();

        // Башня
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.turretAngle);
        if(turret.complete) ctx.drawImage(turret, -30, -30, 60, 60);
        ctx.restore();
    }

    shoot(now) {
        if (now - this.lastShot > 400) { // Перезарядка 400мс
            this.lastShot = now;
            // Спавн пули на конце дула
            const tipX = this.x + Math.cos(this.turretAngle - Math.PI/2) * 40;
            const tipY = this.y + Math.sin(this.turretAngle - Math.PI/2) * 40;
            bullets.push(new Bullet(tipX, tipY, this.turretAngle - Math.PI/2, this.isPlayer));
            
            // Эффект выстрела
            if (isHighGraphics) createExplosion(tipX, tipY, '#f39c12', 5, 2);
        }
    }
}

class Bullet {
    constructor(x, y, angle, isPlayer) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * 600;
        this.vy = Math.sin(angle) * 600;
        this.isPlayer = isPlayer;
        this.life = 2; // сек
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = this.isPlayer ? '#f1c40f' : '#e74c3c';
        ctx.fill();
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.closePath();
        ctx.shadowBlur = 0; // reset
    }
}

class Particle {
    constructor(x, y, color, speed, size) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * speed;
        this.vx = Math.cos(angle) * vel;
        this.vy = Math.sin(angle) * vel;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * size + 2;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function createExplosion(x, y, color, count, size) {
    if (!isHighGraphics) count = Math.floor(count / 3);
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 150, size));
    }
}

/**
 * УПРАВЛЕНИЕ (Мобильные Джойстики)
 */
const joysticks = {
    left: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, dx: 0, dy: 0 },
    right: { active: false, id: null, startX: 0, startY: 0, currX: 0, currY: 0, dx: 0, dy: 0 }
};

function handleTouchStart(e, side) {
    e.preventDefault();
    const joy = joysticks[side];
    const base = side === 'left' ? joyBaseL : joyBaseR;
    const stick = side === 'left' ? joyStickL : joyStickR;
    
    // Берем первое прикосновение в зоне
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (!joy.active) {
            joy.active = true;
            joy.id = t.identifier;
            joy.startX = t.clientX;
            joy.startY = t.clientY;
            joy.currX = t.clientX;
            joy.currY = t.clientY;
            
            base.style.display = 'block';
            base.style.left = t.clientX + 'px';
            base.style.top = t.clientY + 'px';
            stick.style.left = '60px'; // center
            stick.style.top = '60px';
            break;
        }
    }
}

function handleTouchMove(e, side) {
    e.preventDefault();
    const joy = joysticks[side];
    if (!joy.active) return;
    const stick = side === 'left' ? joyStickL : joyStickR;

    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joy.id) {
            joy.currX = t.clientX;
            joy.currY = t.clientY;
            
            let deltaX = joy.currX - joy.startX;
            let deltaY = joy.currY - joy.startY;
            const dist = Math.hypot(deltaX, deltaY);
            const maxDist = 40;
            
            if (dist > maxDist) {
                deltaX = (deltaX / dist) * maxDist;
                deltaY = (deltaY / dist) * maxDist;
            }
            
            stick.style.left = (60 + deltaX) + 'px';
            stick.style.top = (60 + deltaY) + 'px';
            
            // Нормализация вектора [-1, 1]
            joy.dx = deltaX / maxDist;
            joy.dy = deltaY / maxDist;
            break;
        }
    }
}

function handleTouchEnd(e, side) {
    e.preventDefault();
    const joy = joysticks[side];
    const base = side === 'left' ? joyBaseL : joyBaseR;
    
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joy.id) {
            joy.active = false;
            joy.id = null;
            joy.dx = 0;
            joy.dy = 0;
            base.style.display = 'none';
            break;
        }
    }
}

zoneL.addEventListener('touchstart', (e) => handleTouchStart(e, 'left'));
zoneL.addEventListener('touchmove', (e) => handleTouchMove(e, 'left'));
zoneL.addEventListener('touchend', (e) => handleTouchEnd(e, 'left'));
zoneL.addEventListener('touchcancel', (e) => handleTouchEnd(e, 'left'));

zoneR.addEventListener('touchstart', (e) => handleTouchStart(e, 'right'));
zoneR.addEventListener('touchmove', (e) => handleTouchMove(e, 'right'));
zoneR.addEventListener('touchend', (e) => handleTouchEnd(e, 'right'));
zoneR.addEventListener('touchcancel', (e) => handleTouchEnd(e, 'right'));

/**
 * ЛОГИКА ИГРЫ
 */
function spawnEnemy() {
    if (enemies.length < 5) {
        // Спавн с краев
        let ex, ey;
        if (Math.random() > 0.5) {
            ex = Math.random() > 0.5 ? 0 : cw;
            ey = Math.random() * ch;
        } else {
            ex = Math.random() * cw;
            ey = Math.random() > 0.5 ? 0 : ch;
        }
        enemies.push(new Tank(ex, ey, false));
    }
}

function initGame() {
    player = new Tank(cw / 2, ch / 2, true);
    enemies = [];
    bullets = [];
    particles = [];
    score = 0;
    scoreEl.innerText = score;
    lastTime = performance.now();
}

function update(dt, now) {
    // 1. Управление игроком
    player.vx = joysticks.left.dx * player.speed;
    player.vy = joysticks.left.dy * player.speed;
    
    if (joysticks.right.active) {
        player.turretAngle = Math.atan2(joysticks.right.dy, joysticks.right.dx) + Math.PI/2;
        player.shoot(now);
    }
    
    player.update(dt);

    // 2. Враги
    if (Math.random() < 0.02) spawnEnemy();

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        // Глупый ИИ - едет к игроку
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 150) {
            e.vx = (dx / dist) * e.speed;
            e.vy = (dy / dist) * e.speed;
        } else {
            e.vx = 0; e.vy = 0;
        }
        
        e.turretAngle = Math.atan2(dy, dx) + Math.PI/2;
        if (dist < 250) e.shoot(now); // Враг стреляет
        
        e.update(dt);
    }

    // 3. Пули и столкновения
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.update(dt);
        if (b.life <= 0 || b.x < 0 || b.x > cw || b.y < 0 || b.y > ch) {
            bullets.splice(i, 1);
            continue;
        }

        // Попадания
        if (b.isPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 5) {
                    createExplosion(b.x, b.y, '#e74c3c', 10, 3);
                    bullets.splice(i, 1);
                    e.hp -= 34; // 3 хита до смерти
                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, '#c0392b', 30, 6);
                        enemies.splice(j, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                    break;
                }
            }
        } else {
            if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + 5) {
                createExplosion(b.x, b.y, '#f1c40f', 10, 3);
                bullets.splice(i, 1);
                player.hp -= 10;
                if (player.hp <= 0) {
                    createExplosion(player.x, player.y, '#27ae60', 50, 8);
                    gameOver();
                }
            }
        }
    }

    // 4. Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Очистка и фон
    ctx.fillStyle = '#2c3e50'; // Цвет земли
    ctx.fillRect(0, 0, cw, ch);
    
    // Сетка для эффекта движения (простая оптимизация вместо текстур)
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x = 0; x < cw; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
    for(let y = 0; y < ch; y += 50) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
    ctx.stroke();

    particles.forEach(p => p.draw(ctx));
    bullets.forEach(b => b.draw(ctx));
    enemies.forEach(e => e.draw(ctx));
    if (player.hp > 0) player.draw(ctx);
    
    // ХП Бар игрока
    if (player.hp > 0) {
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(player.x - 30, player.y - 45, 60, 6);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(player.x - 30, player.y - 45, 60 * (player.hp / 100), 6);
    }
}

function gameLoop(now) {
    if (gameState !== 'playing') return;
    
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    
    if (dt < 0.1) { // Защита от лагов
        update(dt, now);
        draw();
    }
    
    requestAnimationFrame(gameLoop);
}

/**
 * УПРАВЛЕНИЕ МЕНЮ
 */
function showLobby() {
    gameState = 'lobby';
    lobbyEl.classList.remove('hidden');
    settingsEl.classList.add('hidden');
    hudEl.classList.add('hidden');
    zoneL.classList.add('hidden');
    zoneR.classList.add('hidden');
}

function showSettings() {
    gameState = 'settings';
    lobbyEl.classList.add('hidden');
    settingsEl.classList.remove('hidden');
}

function toggleGraphics() {
    isHighGraphics = !isHighGraphics;
    gfxBtn.innerText = isHighGraphics ? 'Графика: ВЫСОКАЯ' : 'Графика: НИЗКАЯ';
    gfxBtn.style.background = isHighGraphics ? '#e67e22' : '#7f8c8d';
}

function startGame() {
    lobbyEl.classList.add('hidden');
    hudEl.classList.remove('hidden');
    zoneL.classList.remove('hidden');
    zoneR.classList.remove('hidden');
    
    initGame();
    gameState = 'playing';
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameState = 'lobby';
    setTimeout(() => {
        alert(`Танк уничтожен! Ваш счет: ${score}`);
        showLobby();
    }, 100);
}

// Запуск начального экрана
showLobby();

</script>
</body>
</html>
